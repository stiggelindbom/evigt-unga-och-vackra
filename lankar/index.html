<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De Evigt Unga å Vackra – länkar</title>
  <meta name="description" content="Lyssna på Evigt Ung Radio, våra släpp på Spotify och följ oss.">
  <meta property="og:title" content="De Evigt Unga å Vackra">
  <meta property="og:description" content="Radio, nya släpp och alla våra länkar på ett ställe.">
  <meta property="og:image" content="https://devigtunga.se/assets/omslag.jpg">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --svart: #0b0b0b; --yta: #1f1b14; --kant: #3a3020; --guld: #f5c518; --guld-ljus: #ffe27a;
      --text: #f4ecd6; --dampad: #b9ad8d; --spotify: #1ed760;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; background: var(--svart); color: var(--text);
      font-family: "Inter", system-ui, sans-serif; line-height: 1.5;
      background-image: radial-gradient(ellipse 120% 60% at 50% 0%, rgba(245,197,24,.16), transparent 60%);
    }
    main { width: min(480px, 100%); margin: 0 auto; padding: 28px 16px 40px; display: grid; gap: 14px; }
    .logo { width: min(300px, 80%); justify-self: center; filter: drop-shadow(0 6px 24px rgba(245,197,24,.25)); }
    .slogan { text-align: center; color: var(--dampad); font-size: .9rem; letter-spacing: .06em; margin-top: -4px; }
    h2 { font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; color: var(--guld); margin-top: 10px; }
    a { color: inherit; text-decoration: none; }
    .stor {
      display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 18px; border-radius: 999px;
      font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .1em; font-size: 1.05rem;
      background: linear-gradient(135deg, var(--guld-ljus), var(--guld) 50%, #b8860b); color: #111;
      box-shadow: 0 8px 28px rgba(245,197,24,.3); transition: transform .15s;
    }
    .stor:active { transform: scale(.98); }
    .stor svg { width: 20px; height: 20px; fill: currentColor; }
    .knapp {
      display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-radius: 14px;
      background: var(--yta); border: 1px solid var(--kant); font-weight: 600; transition: border-color .15s, transform .15s;
    }
    .knapp:hover { border-color: var(--guld); }
    .knapp:active { transform: scale(.99); }
    .knapp svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
    .knapp span { flex: 1; }
    .knapp small { color: var(--dampad); font-weight: 400; }
    .spotify svg { color: var(--spotify); } .facebook svg { color: #4f9bff; } .instagram svg { color: #ff6fae; } .soundcloud svg { color: #ff8a3d; } .youtube svg { color: #ff5a5a; }
    .slapp {
      display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding: 12px;
      border-radius: 16px; background: var(--yta); border: 1px solid rgba(30,215,96,.4);
    }
    .slapp img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; }
    .slapp b { font-family: "Oswald", sans-serif; font-size: 1.15rem; letter-spacing: .03em; display: block; line-height: 1.2; }
    .slapp .lyssna { display: inline-block; margin-top: 8px; padding: 6px 14px; border-radius: 999px; background: var(--spotify); color: #000; font-weight: 600; font-size: .85rem; }
    .demo { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 8px 12px 8px 8px; border-radius: 14px; background: var(--yta); border: 1px solid var(--kant); }
    .demo img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
    .demo b { font-size: .95rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .demo small { color: var(--dampad); font-size: .78rem; }
    .demo .play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--guld); display: grid; place-items: center; color: var(--guld); }
    .demo .play svg { width: 14px; height: 14px; fill: currentColor; }
    .demo > div { min-width: 0; }
    footer { text-align: center; color: var(--dampad); font-size: .8rem; margin-top: 18px; }
    footer a { color: var(--guld); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../assets/logo.png" alt="De Evigt Unga å Vackra">
    <p class="slogan">★ Festlåtar · Sommarhits · Rent guld ★</p>

    <a class="stor" id="radio" href="../?utm_source=lankar#radio">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Lyssna på Evigt Ung Radio
    </a>

    <div id="slappDel" hidden>
      <h2>Senaste släppet</h2>
      <div id="slapp"></div>
    </div>

    <div id="demoDel" hidden>
      <h2>Nytt från studion</h2>
      <div id="demos" style="display:grid;gap:8px"></div>
    </div>

    <div>
      <h2>Följ oss</h2>
      <div id="lankar" style="display:grid;gap:8px;margin-top:8px"></div>
    </div>

    <footer>
      <p>© <span id="ar"></span> De Evigt Unga å Vackra · <a href="../?utm_source=lankar">devigtunga.se</a></p>
    </footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const slugga = t => String(t).toLowerCase().replace(/[åä]/g, "a").replace(/ö/g, "o").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const rensaTitel = t => String(t || "").replace(/\s*[-–—]\s*radio edit\s*$/i, "").replace(/\s*[([]\s*radio edit\s*[)\]]\s*$/i, "").trim();
    const omslag = l => !l.omslag ? "../assets/omslag.jpg" : /^https?:/.test(l.omslag) ? l.omslag : "../musik/" + encodeURI(l.omslag);
    $("ar").textContent = new Date().getFullYear();

    // ikoner (enkla, egna)
    const IKON = {
      spotify: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.6 14.4a.6.6 0 0 1-.9.2c-2.4-1.5-5.4-1.8-9-1a.6.6 0 1 1-.3-1.2c3.9-.9 7.2-.5 9.9 1.1.3.2.4.6.3.9Zm1.2-2.7a.8.8 0 0 1-1 .3c-2.8-1.7-7-2.2-10.3-1.2a.8.8 0 1 1-.4-1.5c3.8-1.1 8.4-.6 11.5 1.3.3.3.5.7.2 1.1Zm.1-2.8C14.6 9 9.1 8.8 6 9.7a.9.9 0 1 1-.5-1.8c3.6-1.1 9.6-.9 13.4 1.4a.9.9 0 1 1-1 1.6Z"/>',
      facebook: '<path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.5 2.9h-2.3v7A10 10 0 0 0 22 12Z"/>',
      instagram: '<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 3.8c2.7 0 3 0 4 .1 2.7.1 4 1.4 4.1 4.1.1 1 .1 1.4.1 4s0 3-.1 4c-.1 2.7-1.4 4-4.1 4.1-1 .1-1.4.1-4 .1s-3 0-4-.1c-2.7-.1-4-1.4-4.1-4.1-.1-1-.1-1.4-.1-4s0-3 .1-4C4 5.3 5.3 4 8 3.9c1-.1 1.3-.1 4-.1ZM12 2C9.3 2 8.9 2 7.9 2 4.3 2.2 2.2 4.2 2 7.9 2 8.9 2 9.3 2 12s0 3.1.1 4.1c.2 3.6 2.2 5.7 5.9 5.9 1 .1 1.3.1 4 .1s3.1 0 4.1-.1c3.6-.2 5.7-2.2 5.9-5.9.1-1 .1-1.4.1-4.1s0-3.1-.1-4.1c-.2-3.6-2.2-5.7-5.9-5.9C15.1 2 14.7 2 12 2Z"/>',
      soundcloud: '<path d="M2 14.5c0 1.4.9 2.5 2 2.5V12c-1.1 0-2 1.1-2 2.5Zm3-3.4V17h1v-6.3l-1 .4Zm2-.6V17h1V10l-1 .5Zm2-1V17h1V9l-1 .5Zm2-.9V17h7.5a3.5 3.5 0 0 0 0-7c-.5 0-.9.1-1.3.2A5.5 5.5 0 0 0 11 7.6v1Z"/>',
      youtube: '<path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.3 5 12 5 12 5s-6.3 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8c1.5.4 7.8.4 7.8.4s6.3 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8ZM10 15V9l5.2 3L10 15Z"/>',
      mejl: '<path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/>',
      dela: '<path d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 9.8C7.5 9.3 6.8 9 6 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9Z"/>'
    };
    const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${IKON[k]}</svg>`;

    fetch("../musik/innehall.json", { cache: "no-store" }).then(r => r.json()).then(DATA => {
      const L = DATA.lankar || {};
      const latar = (DATA.latar || []).filter(l => !l.dold).map(l => ({ ...l, titel: rensaTitel(l.titel) }));

      // senaste släppet = överst bland släppta i backoffice
      const s = latar.find(l => l.slappt && l.spotify);
      if (s) {
        $("slapp").innerHTML = `<a class="slapp" href="${esc(s.spotify)}" target="_blank" rel="noopener" data-rakna="Senaste släppet: ${esc(s.titel)}">
          <img src="${esc(omslag(s))}" alt="">
          <div><b>${esc(s.titel)}</b><small style="color:var(--dampad)">${esc(s.info || s.typ || "")}</small><br><span class="lyssna">Lyssna på Spotify</span></div></a>`;
        $("slappDel").hidden = false;
      }
      // nytt från studion = de tre översta demos/smakproven
      const d = latar.filter(l => !l.slappt && l.fil).slice(0, 3);
      if (d.length) {
        $("demos").innerHTML = d.map(l => `<a class="demo" href="../?utm_source=lankar#lat-${slugga(l.titel)}" data-rakna="Demo: ${esc(l.titel)}">
          <img src="${esc(omslag(l))}" alt=""><div><b>${esc(l.titel)}</b><small>${typeof l.klipp === "number" ? "Smakprov" : "Demo"} · Evigt Ung Radio</small></div>
          <span class="play">${'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}</span></a>`).join("");
        $("demoDel").hidden = false;
      }
      // följ oss
      const rad = (k, href, text, under = "") => `<a class="knapp ${k}" href="${esc(href)}" ${/^https?:/.test(href) ? 'target="_blank" rel="noopener"' : ""} data-rakna="${esc(text)}">${svg(k)}<span>${esc(text)}${under ? `<br><small>${esc(under)}</small>` : ""}</span></a>`;
      $("lankar").innerHTML = [
        L.spotify && rad("spotify", L.spotify, "Spotify", "Följ oss så missar du inga släpp"),
        L.instagram && rad("instagram", L.instagram, "Instagram"),
        L.facebook && rad("facebook", L.facebook, "Facebook"),
        L.soundcloud && rad("soundcloud", L.soundcloud, "SoundCloud"),
        L.youtube && rad("youtube", L.youtube, "YouTube"),
        L.mejl && rad("mejl", "mailto:" + L.mejl + "?subject=" + encodeURIComponent("Bokning – De Evigt Unga å Vackra"), "Boka oss", L.mejl),
        `<a class="knapp" href="#" id="dela" data-rakna="Dela länksidan">${svg("dela")}<span>Dela sidan</span></a>`
      ].filter(Boolean).join("");
      $("dela").onclick = async e => {
        e.preventDefault();
        const url = "https://devigtunga.se/lankar/";
        try { if (navigator.share) return await navigator.share({ title: "De Evigt Unga å Vackra", url }); } catch { return; }
        try { await navigator.clipboard.writeText(url); e.currentTarget.querySelector("span").textContent = "Länken kopierad ✓"; } catch {}
      };

      // statistik (samma GoatCounter som hemsidan, inga kakor)
      const kod = String(L.statistik || "").trim().toLowerCase().replace(/^https?:\/\//, "").replace(/\.goatcounter\.com.*$/, "");
      if (/^[a-z0-9-]+$/.test(kod)) {
        const sc = document.createElement("script"); sc.async = true;
        sc.dataset.goatcounter = `https://${kod}.goatcounter.com/count`; sc.src = "https://gc.zgo.at/count.js";
        document.head.appendChild(sc);
        document.addEventListener("click", e => {
          const a = e.target.closest("[data-rakna]"); if (!a) return;
          try { window.goatcounter && window.goatcounter.count && window.goatcounter.count({ path: "Länksidan: " + a.dataset.rakna, title: "Länksidan", event: true }); } catch {}
        }, true);
      }
    }).catch(() => {});
  </script>
</body>
</html>
